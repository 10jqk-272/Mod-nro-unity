
name: Check NRO Unity PC Build

on:
  workflow_dispatch:

jobs:
  check-project:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Check Unity project
        run: |
          test -d Assets
          test -d Packages
          test -f ProjectSettings/ProjectVersion.txt
          echo "Unity project files found:"
          cat ProjectSettings/ProjectVersion.txt
